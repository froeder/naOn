<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A252F"/>
      <stop offset="100%" stop-color="#2C3E50"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="50%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#58D68D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#27AE60" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle inner shield ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34495E" stroke-width="4" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Sprout / Shield / Vitality Emblem -->
  <g filter="url(#glow)">
    <!-- Central leaf sprout -->
    <path d="M256 120 C256 120, 180 200, 180 280 C180 330, 214 370, 256 380 C298 370, 332 330, 332 280 C332 200, 256 120, 256 120 Z" fill="url(#greenGrad)"/>
    <!-- Inner vein / light path -->
    <path d="M256 160 C256 210, 236 260, 220 290" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
    <path d="M256 220 C265 245, 280 270, 290 285" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <!-- Outer circle of hope (unbroken ring) -->
    <circle cx="256" cy="256" r="140" fill="none" stroke="#2ECC71" stroke-width="12" stroke-linecap="round" stroke-dasharray="480 80" transform="rotate(-45 256 256)"/>
    <!-- Spark of clarity -->
    <circle cx="256" cy="115" r="14" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark 'naOn' -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ECF0F1" letter-spacing="4">
    na<tspan fill="#2ECC71">On</tspan>
  </text>
</svg>